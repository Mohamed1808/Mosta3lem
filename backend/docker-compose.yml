# Local stack: the API and PostgreSQL 16. From the repository root:
#   docker compose -f backend/docker-compose.yml up --build
# The API is then at http://localhost:4000 (try /health).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mosta3lem
      POSTGRES_USER: mosta3lem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosta3lem -d mosta3lem"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      MOSTA3LEM_MODE: demo
      DATABASE_URL: postgres://mosta3lem:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/mosta3lem
      CORS_ORIGINS: http://localhost:3600,http://localhost:8081
    ports:
      - "4000:4000"
    volumes:
      - files-data:/srv/backend/.data/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  files-data:
